[project]
name = "comp472-project"
version = "0.1.0"
description = "COMP 472 project: comparing k-NN, decision trees, random forests and neural networks on image and sentiment feature vectors"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
